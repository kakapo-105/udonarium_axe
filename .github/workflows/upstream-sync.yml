name: Check upstream release

# 上流の新しいリリースを毎日調べ、試しマージの結果とリリースノートをIssueで知らせる。
# マージもpushもしない。独自機能が多く競合なしで済むことがほとんどないので、
# 取り込みは手元で /axe-upstream-merge を使い、/sw25-test で確かめてから行う。

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Xelltis/udonarium_axe.git
          git fetch upstream --tags --quiet

      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/upstream-check.sh
